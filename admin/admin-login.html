<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RankHub Admin</title>
  <link rel="stylesheet" href="./admin.css">
  <style>
    .admin-login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f5f6f8;
    }

    .admin-login-shell {
      width: min(100%, 440px);
    }

    .admin-login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: #111827;
    }

    .admin-login-brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #dc2626;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(220, 38, 38, 0.16);
    }

    .admin-login-brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .admin-login-brand-label {
      display: block;
      margin-top: 1px;
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .admin-login-card {
      padding: 36px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.09);
    }

    .admin-login-heading {
      margin-bottom: 8px;
      color: #111827;
      font-size: clamp(24px, 5vw, 30px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .admin-login-subtitle {
      margin-bottom: 28px;
      color: #6b7280;
      font-size: 14px;
    }

    .admin-login-label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-pin-input {
      width: 100%;
      min-height: 54px;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #ffffff;
      color: #111827;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .3em;
      text-align: center;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .admin-pin-input:focus {
      outline: none;
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }

    .admin-pin-input[aria-invalid="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }

    .admin-login-button {
      width: 100%;
      min-height: 48px;
      margin-top: 20px;
    }

    .admin-login-button-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .admin-login-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: admin-login-spin .7s linear infinite;
    }

    .admin-login-error {
      min-height: 20px;
      margin-top: 12px;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .admin-login-note {
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
    }

    @keyframes admin-login-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .admin-login-page { padding: 22px 16px; }
      .admin-login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="admin-login-page">
    <div class="admin-login-shell">
      <div class="admin-login-brand" aria-label="RankHub Admin Panel">
        <div class="admin-login-brand-mark" aria-hidden="true">R</div>
        <div>
          <div class="admin-login-brand-name">RANKHUB</div>
          <span class="admin-login-brand-label">Admin Panel</span>
        </div>
      </div>
      <section class="admin-login-card">
        <h1 class="admin-login-heading">Admin Login</h1>
        <p class="admin-login-subtitle">Secure access to RankHub Admin Panel</p>
      <form id="admin-login-form">
        <div class="form-group">
          <label class="admin-login-label" for="admin-pin">4-digit Admin PIN</label>
          <input class="admin-pin-input" id="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="one-time-code" aria-describedby="admin-login-error" required>
        </div>
        <button class="btn btn-primary admin-login-button" id="admin-login-button" type="submit" disabled>
          <span class="admin-login-button-content"><span id="admin-login-button-label">Login</span><span class="admin-login-spinner" id="admin-login-spinner" hidden aria-hidden="true"></span></span>
        </button>
        <p class="admin-login-error" id="admin-login-error" role="alert" aria-live="polite"></p>
      </form>
        <p class="admin-login-note">Authorized administrators only</p>
      </section>
    </div>
  </main>
  <script type="module">
    const form = document.getElementById('admin-login-form');
    const button = document.getElementById('admin-login-button');
    const error = document.getElementById('admin-login-error');
    const pinInput = document.getElementById('admin-pin');
    const buttonLabel = document.getElementById('admin-login-button-label');
    const spinner = document.getElementById('admin-login-spinner');
    const configuredApiBaseUrl = typeof globalThis.RANKHUB_API_BASE_URL === 'string' ? globalThis.RANKHUB_API_BASE_URL.trim() : '';
    const apiBaseUrl = (configuredApiBaseUrl || window.location.origin).replace(/\/+$/, '');

    function setLoading(isLoading) {
      button.disabled = isLoading || pinInput.value.length !== 4;
      buttonLabel.textContent = isLoading ? 'Verifying...' : 'Login';
      spinner.hidden = !isLoading;
      pinInput.disabled = isLoading;
    }

    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
      button.disabled = pinInput.value.length !== 4;
      error.textContent = '';
      pinInput.removeAttribute('aria-invalid');
    });

    pinInput.addEventListener('paste', event => {
      event.preventDefault();
      const pastedPin = (event.clipboardData?.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      pinInput.value = pastedPin;
      pinInput.dispatchEvent(new Event('input', { bubbles: true }));
    });

    pinInput.focus();

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!/^\d{4}$/.test(pinInput.value)) {
        error.textContent = 'Enter exactly 4 numeric digits.';
        button.disabled = true;
        pinInput.setAttribute('aria-invalid', 'true');
        pinInput.focus();
        return;
      }

      setLoading(true);
      error.textContent = '';
      try {
        const response = await fetch(`${apiBaseUrl}/api/admin/auth/pin`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pinInput.value })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const errorMessage = response.status === 401
            ? 'Incorrect PIN. Try again.'
            : response.status === 429
              ? 'Too many attempts. Please wait and try again.'
              : response.status >= 500
                ? 'Login service is temporarily unavailable.'
                : (data.error || 'Admin PIN authentication failed.');
          const authError = new Error(errorMessage);
          authError.isNetworkError = false;
          throw authError;
        }

        const returnUrl = new URLSearchParams(window.location.search).get('returnUrl');
        window.location.replace(returnUrl && returnUrl.startsWith('/') ? returnUrl : './admin-dashboard.html');
      } catch (authError) {
        authError.isNetworkError = authError.isNetworkError ?? authError instanceof TypeError;
        error.textContent = authError.isNetworkError
          ? 'Unable to reach the login service. Check your connection and try again.'
          : authError.message;
        pinInput.value = '';
        pinInput.setAttribute('aria-invalid', 'true');
        setLoading(false);
        pinInput.focus();
      }
    });
  </script>
</body>
</html>
